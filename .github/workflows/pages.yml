name: Deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Check generated pages
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/check_test_sensitivity.py
          python scripts/build_portfolio.py
          git diff --exit-code -- index.html projects
      - name: Check portfolio in Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/ > /dev/null && break
            sleep 1
          done
          python tests/browser_check.py
          python tests/case_studies_check.py
          python tests/accessibility_check.py
      - name: Package public files
        run: |
          mkdir -p /tmp/portfolio-site
          cp index.html style.css app.js .nojekyll /tmp/portfolio-site/
          cp -R assets /tmp/portfolio-site/assets
          cp -R projects /tmp/portfolio-site/projects
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/portfolio-site
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
